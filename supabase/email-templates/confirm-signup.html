<!--
  Supabase Dashboard → Authentication → Email Templates → Confirm signup.
  Paste this into the "Message body" field (it accepts raw HTML + Supabase's
  Go template variables, e.g. {{ .ConfirmationURL }}).

  Replace YOUR_PORTAL_DOMAIN below with the real production Portal URL
  (e.g. app.bgrowthclub.com) once known — email clients load images from an
  absolute URL, a relative /logo.png won't resolve from an inbox.
-->
<div style="background-color:#f4f6fb; padding:32px 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 1px 3px rgba(16,24,40,0.08);">
    <tr>
      <td style="background:#0B1C3B; padding:28px 32px; text-align:center;">
        <img src="https://YOUR_PORTAL_DOMAIN/logo.png" alt="BGrowth" width="40" height="40" style="display:block; margin:0 auto 8px;" />
        <span style="color:#ffffff; font-size:16px; font-weight:700; letter-spacing:0.02em;">BGrowth Portal</span>
      </td>
    </tr>
    <tr>
      <td style="padding:32px;">
        <h1 style="margin:0 0 12px; font-size:22px; font-weight:700; color:#0B1C3B;">Confirm your email</h1>
        <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#475569;">
          Welcome to BGrowth — you're one step away from activating your first free Workspace trial.
          Confirm your email address to get started.
        </p>
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block; background:#1061EC; color:#ffffff; font-weight:600; font-size:15px; text-decoration:none; padding:14px 28px; border-radius:999px;">
          Confirm my email
        </a>
        <p style="margin:24px 0 0; font-size:13px; line-height:1.6; color:#94a3b8;">
          If you didn't create a BGrowth account, you can safely ignore this email.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px; background:#f8fafc; text-align:center;">
        <p style="margin:0; font-size:12px; color:#94a3b8;">BGrowth Club · bgrowthclub.com</p>
      </td>
    </tr>
  </table>
</div>
